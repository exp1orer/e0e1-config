name: Build Windows x86 (Cross-compile on Linux)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install MinGW-w64 (i686) and SQLite dev
        run: |
          sudo apt update
          sudo apt install -y gcc-mingw-w64-i686
          # 手动下载并编译 SQLite 静态库（32位）
          wget https://sqlite.org/2024/sqlite-autoconf-3450300.tar.gz
          tar xzf sqlite-autoconf-*.tar.gz
          cd sqlite-autoconf-*
          ./configure --host=i686-w64-mingw32 --prefix=/usr/i686-w64-mingw32
          make -j$(nproc)
          sudo make install

      - name: Build for Windows x86 with CGO
        run: |
          export CC=i686-w64-mingw32-gcc
          export CXX=i686-w64-mingw32-g++
          export GOOS=windows
          export GOARCH=386
          export CGO_ENABLED=1
          export CGO_CFLAGS="-I/usr/i686-w64-mingw32/include"
          export CGO_LDFLAGS="-L/usr/i686-w64-mingw32/lib -lsqlite3"
          go build -ldflags "-w -s" -o e0e1-config.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: e0e1-config-windows-386
          path: e0e1-config.exe
