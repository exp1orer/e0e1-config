name: Build Windows x86 Binary (CGO + SQLite)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'

      - name: Install MSYS2 with MinGW-w64 (i686) and SQLite3 dev
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: mingw-w64-i686-gcc mingw-w64-i686-sqlite3
          path-type: inherit

      - name: Build for Windows x86
        shell: msys2 {0}
        run: |
          export CC=i686-w64-mingw32-gcc
          export CXX=i686-w64-mingw32-g++
          export GOOS=windows
          export GOARCH=386
          export CGO_ENABLED=1
          # 指定头文件路径（通常安装后自动包含）
          export CGO_CFLAGS="-I/mingw32/include"
          export CGO_LDFLAGS="-L/mingw32/lib -lsqlite3"
          go build -ldflags "-w -s" -o e0e1-config.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: e0e1-config-windows-386
          path: e0e1-config.exe
