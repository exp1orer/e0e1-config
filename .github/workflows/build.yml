name: Build Windows x86 Binary (Pure Go)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'

      # 升级 modernc.org/sqlite 到纯 Go 版本
      - name: Upgrade SQLite driver
        run: go get -u modernc.org/sqlite@latest

      - name: Build for Windows x86 (no CGO)
        run: |
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "386"
          go build -ldflags "-w -s" -o e0e1-config.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: e0e1-config-windows-386
          path: e0e1-config.exe
