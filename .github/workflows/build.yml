name: Build Windows x86 Binary (Pure Go,强制升级)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'   # 满足 modernc.org 最新依赖

      # 强制修改 go.mod，将 sqlite 驱动升级到纯 Go 版本
      - name: Force upgrade modernc.org/sqlite to v1.30.0
        run: |
          go mod edit -require modernc.org/sqlite@v1.30.0
          go mod tidy

      # 验证版本是否已更新（调试用）
      - name: Check version
        run: go list -m modernc.org/sqlite

      # 禁用 CGO，编译 32 位 Windows 二进制
      - name: Build for Windows x86 (no CGO)
        run: |
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "386"
          go build -ldflags "-w -s" -o e0e1-config.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: e0e1-config-windows-386
          path: e0e1-config.exe
