name: Build Windows x86 Binary

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:   # 支持手动触发

jobs:
  build:
    name: Build Windows x86
    runs-on: windows-latest   # 使用 Windows 运行器，便于直接生成 .exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'   # 与项目 go.mod 保持一致

      - name: Build for Windows x86
        run: |
          go build -ldflags "-w -s" -o e0e1-config.exe .
        env:
          GOOS: windows
          GOARCH: 386          # 关键：指定 32 位架构

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: e0e1-config-windows-386
          path: e0e1-config.exe
