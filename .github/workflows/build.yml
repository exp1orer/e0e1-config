name: Build Windows x86 Binary

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'

      - name: Install MinGW and SQLite dev
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 sqlite3 libsqlite3-dev

      - name: Build for Windows x86
        run: |
          CC=i686-w64-mingw32-gcc CXX=i686-w64-mingw32-g++ GOOS=windows GOARCH=386 CGO_ENABLED=1 go build -ldflags "-w -s" -o e0e1-config.exe .
        env:
          CGO_CFLAGS: "-I/usr/include"  # 可能需要，但默认应该可以

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: e0e1-config-windows-386
          path: e0e1-config.exe
