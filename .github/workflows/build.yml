name: Build Windows x86 Binary (with CGO)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:   # 手动触发

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'   # 与项目 go.mod 保持一致

      # 安装 MinGW-w64 (32位)，并自动加入 PATH
      - name: Install MinGW-w64 (i686)
        uses: eike-hass/action-mingw-w64@v1
        with:
          architecture: i686   # 32 位
          platform: posix      # 或 win32，posix 更通用

      - name: Build for Windows x86
        shell: powershell
        run: |
          $env:CC = "i686-w64-mingw32-gcc"
          $env:CXX = "i686-w64-mingw32-g++"
          $env:GOOS = "windows"
          $env:GOARCH = "386"
          $env:CGO_ENABLED = "1"
          go build -ldflags "-w -s" -o e0e1-config.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: e0e1-config-windows-386
          path: e0e1-config.exe
