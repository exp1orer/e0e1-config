name: Build Windows x86 Binary (CGO + MSYS2)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'   # 满足 modernc.org 依赖

      - name: Install MSYS2 with MinGW-w64 (i686) and SQLite3
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-i686-gcc
            mingw-w64-i686-sqlite3
            mingw-w64-i686-pkg-config
          path-type: inherit   # 使 go 命令在 MSYS2 shell 中可用

      - name: Build for Windows x86
        shell: msys2 {0}
        run: |
          export CC=i686-w64-mingw32-gcc
          export CXX=i686-w64-mingw32-g++
          export GOOS=windows
          export GOARCH=386
          export CGO_ENABLED=1
          # 显式指定头文件和库路径（MSYS2 默认安装位置）
          export CGO_CFLAGS="-I/mingw32/include"
          export CGO_LDFLAGS="-L/mingw32/lib -lsqlite3"
          # 可选：设置 pkg-config 路径（备选）
          export PKG_CONFIG_PATH=/mingw32/lib/pkgconfig
          go build -ldflags "-w -s" -o e0e1-config.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: e0e1-config-windows-386
          path: e0e1-config.exe
